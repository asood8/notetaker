[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "notetaker"
version = "0.1.0.dev0"
description = "Turn notes into Anki flashcards using a local LLM."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aadit Sood" }]
keywords = ["anki", "flashcards", "ollama", "llm", "spaced-repetition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "genanki>=0.13",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "fpdf2>=2.7", "fastapi>=0.110", "python-multipart>=0.0.9"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]

[project.scripts]
notetaker = "notetaker.cli:app"

[project.urls]
Homepage = "https://github.com/asood8/notetaker"
Issues = "https://github.com/asood8/notetaker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/notetaker"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: requires a running Ollama server"]
